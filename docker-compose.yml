x-app-env: &app-env
  APP_ENV: local
  APP_DEBUG: "true"
  APP_URL: http://localhost:8000
  APP_KEY: base64:IxaRNYsmOhlOzqKXumuiDlOtmt/2p7ZTVcEYISL/Jeo=
  DB_CONNECTION: pgsql
  DB_HOST: postgres
  DB_PORT: 5432
  DB_DATABASE: techzu_stms
  DB_USERNAME: postgres
  DB_PASSWORD: secret
  QUEUE_CONNECTION: redis
  REDIS_QUEUE_RETRY_AFTER: "1860"
  CACHE_STORE: redis
  REDIS_CLIENT: predis
  REDIS_HOST: redis
  REDIS_PORT: 6379
  SESSION_DRIVER: database
  MAIL_MAILER: log

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: techzu-app
    restart: unless-stopped
    working_dir: /var/www
    environment: *app-env
    volumes:
      - ./:/var/www
    networks:
      - techzu
    depends_on:
      - postgres
      - redis

  nginx:
    image: nginx:alpine
    container_name: nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - techzu
    depends_on:
      - app

  postgres:
    image: postgres:16-alpine
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: techzu_stms
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secret
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - techzu

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - techzu

volumes:
  pgdata:

networks:
  techzu:
    driver: bridge
