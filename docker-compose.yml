x-app-env: &app-env
  DB_HOST: postgres
  REDIS_HOST: redis
  QUEUE_CONNECTION: redis
  CACHE_STORE: redis
  REDIS_CLIENT: predis
  REDIS_QUEUE_RETRY_AFTER: "1860"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: techzu-app
    restart: unless-stopped
    working_dir: /var/www
    environment: *app-env
    volumes:
      - ./:/var/www
    networks:
      - techzu
    depends_on:
      - postgres
      - redis

  nginx:
    image: nginx:alpine
    container_name: nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - techzu
    depends_on:
      - app

  postgres:
    image: postgres:16-alpine
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-techzu_stms}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - techzu

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - techzu

volumes:
  pgdata:

networks:
  techzu:
    driver: bridge
