name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-24.04

    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: techzu_stms
      DB_USERNAME: postgres
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: techzu_stms
          POSTGRES_USER: postgres
          # Throwaway CI database, reachable only from the runner: no password.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo, pdo_pgsql, mbstring, bcmath, gd
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Copy env
        run: cp .env.example .env

      - name: Generate key
        run: php artisan key:generate

      - name: Migrate and seed
        run: php artisan migrate --force --seed

      - name: Build assets
        run: |
          npm ci --ignore-scripts
          npm run build

      - name: Run Pint
        run: vendor/bin/pint --test

      - name: Run tests
        run: php artisan test
